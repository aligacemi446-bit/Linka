<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Linka</title>

    <link rel="stylesheet"
          href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header class="topbar">

    <div class="logo">
        Linka
    </div>

    <div class="search">
        <input
            id="searchInput"
            type="text"
            placeholder="ابحث..."
            oninput="searchPosts()"
        >
    </div>

    <nav>

        <button onclick="showPage('home')">
            🏠
        </button>

        <button onclick="showPage('friends')">
            👥
        </button>

        <button onclick="showPage('messages')">
            💬
        </button>

        <button onclick="showPage('notifications')">
            🔔
        </button>

        <button onclick="showPage('profile')">
            👤
        </button>

    </nav>

</header>


<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="mini-profile">

            <div class="avatar">
                👤
            </div>

            <div>

                <strong id="sideUsername">
                    زائر
                </strong>

                <small>
                    Linka
                </small>

            </div>

        </div>


        <button onclick="showPage('home')">
            🏠 الرئيسية
        </button>

        <button onclick="showPage('profile')">
            👤 ملفي
        </button>

        <button onclick="showPage('friends')">
            👥 الأصدقاء
        </button>

        <button onclick="showPage('messages')">
            💬 الرسائل
        </button>

        <button onclick="showPage('notifications')">
            🔔 الإشعارات
        </button>

        <button onclick="showPage('settings')">
            ⚙️ الإعدادات
        </button>

        <hr>

        <button onclick="toggleDarkMode()">
            🌙 الوضع الليلي
        </button>

        <button
            id="logoutButton"
            onclick="logout()">

            🚪 تسجيل الخروج

        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <!-- LOGIN / REGISTER -->

        <section
            id="authPage"
            class="page">

            <div class="auth-box">

                <h1>
                    Linka
                </h1>

                <p>
                    تواصل مع أصدقائك بسهولة
                </p>


                <div class="tabs">

                    <button
                        id="loginTab"
                        class="active"
                        onclick="showAuth('login')">

                        تسجيل الدخول

                    </button>

                    <button
                        id="registerTab"
                        onclick="showAuth('register')">

                        إنشاء حساب

                    </button>

                </div>


                <!-- LOGIN -->

                <div id="loginForm">

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="البريد الإلكتروني"
                    >

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="كلمة المرور"
                    >

                    <button
                        class="primary"
                        onclick="login()">

                        تسجيل الدخول

                    </button>

                </div>


                <!-- REGISTER -->

                <div
                    id="registerForm"
                    class="hidden">

                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="اسم المستخدم"
                    >

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="البريد الإلكتروني"
                    >

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="كلمة المرور"
                    >

                    <button
                        class="primary"
                        onclick="register()">

                        إنشاء الحساب

                    </button>

                </div>


                <div
                    id="authMessage"
                    class="message-box">
                </div>

            </div>

        </section>


        <!-- HOME -->

        <section
            id="homePage"
            class="page hidden">

            <h2>
                الرئيسية
            </h2>


            <div class="create-post">

                <textarea
                    id="postContent"
                    placeholder="بماذا تفكر؟">
                </textarea>

                <button
                    class="primary"
                    onclick="createPost()">

                    نشر المنشور

                </button>

            </div>


            <div id="postsContainer">

            </div>

        </section>


        <!-- PROFILE -->

        <section
            id="profilePage"
            class="page hidden">

            <div class="cover">

            </div>


            <div class="profile-card">

                <div class="big-avatar">
                    👤
                </div>

                <h2 id="profileName">
                    المستخدم
                </h2>

                <p id="profileUsername">
                    @user
                </p>

                <p id="profileBio">
                    مرحبًا بك في Linka!
                </p>

            </div>

        </section>


        <!-- FRIENDS -->

        <section
            id="friendsPage"
            class="page hidden">

            <h2>
                الأصدقاء
            </h2>

            <div class="friends-grid">

                <div class="friend">

                    <div class="friend-avatar">
                        👨
                    </div>

                    <h3>
                        Yacine
                    </h3>

                    <button>
                        إضافة صديق
                    </button>

                </div>


                <div class="friend">

                    <div class="friend-avatar">
                        👩
                    </div>

                    <h3>
                        Nour
                    </h3>

                    <button>
                        إضافة صديق
                    </button>

                </div>


                <div class="friend">

                    <div class="friend-avatar">
                        👨
                    </div>

                    <h3>
                        Mohamed
                    </h3>

                    <button>
                        إضافة صديق
                    </button>

                </div>

            </div>

        </section>


        <!-- MESSAGES -->

        <section
            id="messagesPage"
            class="page hidden">

            <h2>
                Messenger
            </h2>

            <div class="messenger">

                <div class="conversations">

                    <div class="conversation active">
                        👨 Mohamed
                    </div>

                    <div class="conversation">
                        👩 Nour
                    </div>

                    <div class="conversation">
                        👨 Yacine
                    </div>

                </div>


                <div class="chat">

                    <div class="chat-header">
                        Mohamed
                    </div>

                    <div
                        id="chatMessages"
                        class="chat-messages">

                        <div class="received">
                            مرحبًا 👋
                        </div>

                    </div>


                    <div class="chat-input">

                        <input
                            id="messageInput"
                            placeholder="اكتب رسالة..."
                            onkeydown="
                                if(event.key==='Enter')
                                sendMessage()
                            "
                        >

                        <button
                            onclick="sendMessage()">

                            إرسال

                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- NOTIFICATIONS -->

        <section
            id="notificationsPage"
            class="page hidden">

            <h2>
                الإشعارات
            </h2>

            <div class="notification">
                🔔 لا توجد إشعارات جديدة.
            </div>

        </section>


        <!-- SETTINGS -->

        <section
            id="settingsPage"
            class="page hidden">

            <h2>
                الإعدادات
            </h2>

            <div class="setting">

                <span>
                    🌙 الوضع الليلي
                </span>

                <button
                    onclick="toggleDarkMode()">

                    تغيير

                </button>

            </div>

            <div class="setting">

                <span>
                    🔔 الإشعارات
                </span>

                <button>
                    تشغيل
                </button>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
